name: Create Release Docker Images

on:

  push:
    tags:
      - v*

  workflow_dispatch:
    inputs:
      release_version:
        description: 'Comma-separated list of versions to build, e.g. "v6.0.0","v6.1.0"'
        default: '"v6.1.0"'
        required: true
        type: string
      update_latest:
        description: 'For "vX.Y.Z" versions, update the corresponding "X.Y-latest" images.'
        default: false 
        required: true
        type: boolean

  schedule:
    - cron: "30 03 * * 0"

env:
  DOCKERHUB_REPO: dtcenter/metviewer

jobs:

  define-matrix:
    name: Define Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.get-versions.outputs.matrix }}
      update_latest: ${{ steps.get-versions.outputs.update_latest }}
    steps:
      - name: Get versions to build 
        id: get-versions
        run: |
          if [[ ${{ github.event_name }} == 'schedule' ]]; then
            version_list="\"v6.0.0\",\"v6.0.1\",\"v6.1.0\""
            update_latest="true"
          elif [[ ${{ github.event_name }} == 'workflow_dispatch' ]]; then
            version_list=${{ toJSON(inputs.release_version) }}
            update_latest=${{ toJSON(inputs.update_latest) }}
          else
            version_list=\"${{ toJSON(github.ref_name) }}\"
            update_latest="true"
          fi
          echo "matrix={\"version\": [ ${version_list} ]}" >> $GITHUB_OUTPUT
          echo "update_latest=${update_latest}" >> $GITHUB_OUTPUT

  build_scan_and_push:
    name: Build, Scan, and Push Images
    runs-on: ubuntu-latest
    needs: define-matrix
    strategy:
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.version }}
          path: ${{ matrix.version }}
          sparse-checkout: internal/scripts/docker/Dockerfile
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@v4
        with:
          repository: 'dtcenter/METplus'
          ref: 'develop'
          path: 'develop'
          sparse-checkout: metplus/component_versions.py
          sparse-checkout-cone-mode: false

      - name: Free Disk Space
        uses: dtcenter/metplus-action-free-disk-space@v1

      - name: Create directories to store build log output
        run: mkdir -p ${RUNNER_WORKSPACE}/logs

      - name: Build Docker Image
        run: .github/jobs/build_docker_image.sh
        env:
          SOURCE_BRANCH: ${{ matrix.version }}

      - name: Get DockerHub tag
        id: get-dockerhub-tag
        run: |
          source ${GITHUB_WORKSPACE}/.github/jobs/bash_functions.sh
          DOCKERHUB_TAG=$(get_dockerhub_tag)
          echo "DOCKERHUB_TAG=${DOCKERHUB_TAG}" >> $GITHUB_OUTPUT
        env:
          SOURCE_BRANCH: ${{ matrix.version }}

      - name: Scan Docker Images
        id: security-scan
        continue-on-error: false
        uses: dtcenter/metplus-action-scan-docker-images@v1
        with:
          images: |
            [
              "${{ steps.get-dockerhub-tag.outputs.DOCKERHUB_TAG }}"
            ]
          fail-on-critical: "true"
          log-artifact-name: 'security-scan-logs_${{ matrix.version }}'

      - name: Push Docker Image
        run: .github/jobs/push_docker_image.sh
        env:
          SOURCE_BRANCH: ${{ matrix.version }}
          UPDATE_LATEST: ${{ fromJSON(needs.define-matrix.outputs.update_latest) }}
          DOCKER_USERNAME: 'dtcenter'
          DOCKER_PASSWORD: ${{ secrets.DOCKER_TOKEN }}

      - name: Copy build log files into logs directory
        if: always()
        run: cp ${GITHUB_WORKSPACE}/*.log ${RUNNER_WORKSPACE}/logs/

      - name: Upload build logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build_logs_${{ matrix.version }}
          path: ${{ runner.workspace }}/logs
          if-no-files-found: ignore

